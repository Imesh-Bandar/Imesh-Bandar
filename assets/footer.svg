<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Thanks for visiting">
<title>Thanks for visiting</title>
<defs>
  <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0E1526"/></linearGradient>
  <linearGradient id="gF" x1="0" x2="1"><stop offset="0" stop-color="#4FC3F7"/><stop offset=".55" stop-color="#2F6BFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="lineF" x1="0" x2="1"><stop offset="0" stop-color="#4FC3F7" stop-opacity="0"/><stop offset=".5" stop-color="#2F6BFF"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
  <pattern id="dF" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".06"/></pattern>
  <filter id="bF" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <clipPath id="cF"><rect width="1200" height="120" rx="22"/></clipPath>
</defs>
<g clip-path="url(#cF)">
  <rect width="1200" height="120" fill="url(#bgF)"/>
  <circle cx="300" cy="120" r="150" fill="#2F6BFF" opacity="0.35" filter="url(#bF)"><animateTransform attributeName="transform" type="translate" values="0 0;80 -10;0 0" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="0" r="150" fill="#8B5CF6" opacity="0.3" filter="url(#bF)"><animateTransform attributeName="transform" type="translate" values="0 0;-80 10;0 0" dur="14s" repeatCount="indefinite"/></circle>
  <rect width="1200" height="120" fill="url(#dF)"/>
</g>
<rect x=".5" y=".5" width="1199" height="119" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<text x="600" y="58" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="url(#gF)">Thanks for stopping by</text>
<text x="600" y="86" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#8B949E">learn() → build() → ship() → repeat()</text>
</svg>