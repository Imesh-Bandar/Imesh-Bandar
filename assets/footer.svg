<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Thanks for visiting">
<title>Thanks for visiting</title>
<defs>
  <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0D1424"/>
  </linearGradient>
  <linearGradient id="brandF" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4FC3F7"/><stop offset=".55" stop-color="#2F6BFF"/><stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <linearGradient id="strokeF" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity=".9"/><stop offset=".5" stop-color="#2F6BFF" stop-opacity=".25"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".8"/>
  </linearGradient>
  <pattern id="dotsF" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/>
  </pattern>
  <filter id="blurF" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glowF" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="cF"><rect width="1200" height="150" rx="24"/></clipPath></defs>
<g clip-path="url(#cF)">
  <rect width="1200" height="150" fill="url(#bgF)"/>
  <circle cx="200" cy="150" r="160" fill="#2F6BFF" opacity="0.4" filter="url(#blurF)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 80 -20; 0 0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="0" r="160" fill="#8B5CF6" opacity="0.35" filter="url(#blurF)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -80 20; 0 0" dur="14s" repeatCount="indefinite"/>
  </circle>
  <rect width="1200" height="150" fill="url(#dotsF)"/>
</g>
<rect x=".5" y=".5" width="1199" height="149" rx="24" fill="none" stroke="url(#strokeF)" stroke-opacity=".6"/>
<text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="url(#brandF)">Thanks for visiting!</text>
<text x="600" y="106" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" fill="#8B949E">while (alive) { learn(); build(); ship(); }</text>
</svg>