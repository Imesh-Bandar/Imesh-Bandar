<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Imesh Bandara — Full Stack Software Engineer">
<title>Imesh Bandara — Full Stack Software Engineer</title>
<defs>
  <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0E1526"/></linearGradient>
  <linearGradient id="gH" x1="0" x2="1"><stop offset="0" stop-color="#4FC3F7"/><stop offset=".55" stop-color="#2F6BFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="lineH" x1="0" x2="1"><stop offset="0" stop-color="#4FC3F7" stop-opacity="0"/><stop offset=".5" stop-color="#2F6BFF"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
  <pattern id="dH" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".06"/></pattern>
  <filter id="bH" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <clipPath id="cH"><rect width="1200" height="320" rx="22"/></clipPath>
</defs>
<g clip-path="url(#cH)">
  <rect width="1200" height="320" fill="url(#bgH)"/>
  <circle cx="330" cy="40" r="190" fill="#2F6BFF" opacity="0.45" filter="url(#bH)"><animateTransform attributeName="transform" type="translate" values="0 0;90 40;0 0" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="300" r="200" fill="#8B5CF6" opacity="0.38" filter="url(#bH)"><animateTransform attributeName="transform" type="translate" values="0 0;-90 -30;0 0" dur="16s" repeatCount="indefinite"/></circle>
  <rect width="1200" height="320" fill="url(#dH)"/>
</g>
<rect x=".5" y=".5" width="1199" height="319" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<text x="600" y="92" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#4FC3F7" xml:space="preserve">~ $ whoami<tspan fill="#4FC3F7">▍<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
<text x="600" y="172" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#gH)">Imesh Bandara</text>
<text x="600" y="218" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#E6EDF3">Full Stack Software Engineer</text>
<text x="600" y="252" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" letter-spacing=".5" fill="#8B949E">MERN  ·  Laravel  ·  Microservices  ·  Sri Lanka</text>
<rect x="450" y="282" width="300" height="2" rx="1" fill="url(#lineH)"/>
</svg>