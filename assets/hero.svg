<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Imesh Bandara — Full Stack Software Engineer">
<title>Imesh Bandara — Full Stack Software Engineer</title>
<defs>
  <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0D1424"/>
  </linearGradient>
  <linearGradient id="brandH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4FC3F7"/><stop offset=".55" stop-color="#2F6BFF"/><stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <linearGradient id="strokeH" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity=".9"/><stop offset=".5" stop-color="#2F6BFF" stop-opacity=".25"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".8"/>
  </linearGradient>
  <pattern id="dotsH" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/>
  </pattern>
  <filter id="blurH" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glowH" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clipH"><rect width="1200" height="420" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clipH)">
  <rect width="1200" height="420" fill="url(#bgH)"/>
  <circle cx="180" cy="80" r="200" fill="#2F6BFF" opacity="0.45" filter="url(#blurH)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 60 40; 0 0" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="360" r="230" fill="#8B5CF6" opacity="0.4" filter="url(#blurH)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -70 -30; 0 0" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="40" r="160" fill="#4FC3F7" opacity="0.3" filter="url(#blurH)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -40 50; 0 0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect width="1200" height="420" fill="url(#dotsH)"/>
</g>
<rect x=".5" y=".5" width="1199" height="419" rx="24" fill="none" stroke="url(#strokeH)" stroke-opacity=".6"/>

<!-- left copy -->
<g>
  <rect x="64" y="70" width="210" height="30" rx="15" fill="#4FC3F7" fill-opacity=".1" stroke="#4FC3F7" stroke-opacity=".35"/>
  <circle cx="84" cy="85" r="5" fill="#3FB950"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="98" y="90" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#4FC3F7">open to collaborate</text>
</g>
<g>
  
  <text x="62" y="176" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#brandH)">Imesh Bandara</text>
</g>
<g>
  <text x="64" y="224" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#E6EDF3">Full Stack Software Engineer</text>
  <text x="64" y="258" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8B949E">Trainee SE @ Synergy Information System  ·  Sri Lanka</text>
</g>
<g>
      <rect x="64" y="300" width="64" height="34" rx="17" fill="#ffffff" fill-opacity=".04" stroke="url(#strokeH)"/>
      <text x="96" y="322" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">MERN</text></g><g>
      <rect x="138.4" y="300" width="64" height="34" rx="17" fill="#ffffff" fill-opacity=".04" stroke="url(#strokeH)"/>
      <text x="171" y="322" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">MEAN</text></g><g>
      <rect x="212.8" y="300" width="90" height="34" rx="17" fill="#ffffff" fill-opacity=".04" stroke="url(#strokeH)"/>
      <text x="258" y="322" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">Laravel</text></g><g>
      <rect x="313.0" y="300" width="90" height="34" rx="17" fill="#ffffff" fill-opacity=".04" stroke="url(#strokeH)"/>
      <text x="358" y="322" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">Next.js</text></g><g>
      <rect x="413.2" y="300" width="142" height="34" rx="17" fill="#ffffff" fill-opacity=".04" stroke="url(#strokeH)"/>
      <text x="484" y="322" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">Microservices</text></g>

<!-- code window -->
<g transform="translate(700 62)">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="6s" repeatCount="indefinite"/>
    <rect width="436" height="296" rx="16" fill="#0D1117" fill-opacity=".92" stroke="#30363D"/>
    <rect width="436" height="40" rx="16" fill="#161B22"/>
    <rect y="24" width="436" height="16" fill="#161B22"/>
    <line x1="0" y1="40" x2="436" y2="40" stroke="#30363D"/>
    <circle cx="22" cy="20" r="6" fill="#FF5F57"/><circle cx="42" cy="20" r="6" fill="#FEBC2E"/><circle cx="62" cy="20" r="6" fill="#28C840"/>
    <text x="218" y="25" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#8B949E">imesh.ts</text>
    <text x="32" y="86" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#FF7B72">const </tspan><tspan fill="#D2A8FF">imesh</tspan><tspan fill="#E6EDF3"> = {</tspan></text>
      <text x="12" y="86" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#484F58" text-anchor="middle">1</text><text x="32" y="111" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79C0FF">  role</tspan><tspan fill="#E6EDF3">: </tspan><tspan fill="#A5D6FF">"Full Stack Engineer"</tspan><tspan fill="#E6EDF3">,</tspan></text>
      <text x="12" y="111" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#484F58" text-anchor="middle">2</text><text x="32" y="136" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79C0FF">  company</tspan><tspan fill="#E6EDF3">: </tspan><tspan fill="#A5D6FF">"Synergy IS"</tspan><tspan fill="#E6EDF3">,</tspan></text>
      <text x="12" y="136" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#484F58" text-anchor="middle">3</text><text x="32" y="161" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79C0FF">  stack</tspan><tspan fill="#E6EDF3">: [</tspan><tspan fill="#A5D6FF">"React"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#A5D6FF">"Node"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#A5D6FF">"Laravel"</tspan><tspan fill="#E6EDF3">],</tspan></text>
      <text x="12" y="161" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#484F58" text-anchor="middle">4</text><text x="32" y="186" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79C0FF">  learning</tspan><tspan fill="#E6EDF3">: [</tspan><tspan fill="#A5D6FF">"Java"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#A5D6FF">"Microservices"</tspan><tspan fill="#E6EDF3">],</tspan></text>
      <text x="12" y="186" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#484F58" text-anchor="middle">5</text><text x="32" y="211" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79C0FF">  coffee</tspan><tspan fill="#E6EDF3">: </tspan><tspan fill="#79C0FF">Infinity</tspan><tspan fill="#E6EDF3">,</tspan></text>
      <text x="12" y="211" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#484F58" text-anchor="middle">6</text><text x="32" y="236" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#E6EDF3">};</tspan></text>
      <text x="12" y="236" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#484F58" text-anchor="middle">7</text>
    <text x="32" y="271" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5" fill="#8B949E">// building scalable systems that matter</text>
    <rect x="32" y="279" width="9" height="3" fill="#4FC3F7"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</g>
</svg>