<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-label="Employee Manager — Management System">
<title>Employee Manager — Management System</title>
<defs>
  <linearGradient id="bgP4" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0D1424"/>
  </linearGradient>
  <linearGradient id="brandP4" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4FC3F7"/><stop offset=".55" stop-color="#2F6BFF"/><stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <linearGradient id="strokeP4" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity=".9"/><stop offset=".5" stop-color="#2F6BFF" stop-opacity=".25"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".8"/>
  </linearGradient>
  <pattern id="dotsP4" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/>
  </pattern>
  <filter id="blurP4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glowP4" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="cP4"><rect width="580" height="250" rx="18"/></clipPath></defs>
<g clip-path="url(#cP4)">
  <rect width="580" height="250" fill="url(#bgP4)"/>
  <circle cx="540" cy="-10" r="120" fill="#D29922" opacity="0.22" filter="url(#blurP4)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -30 20; 0 0" dur="10s" repeatCount="indefinite"/>
  </circle>
  <rect width="580" height="250" fill="url(#dotsP4)"/>
  <rect width="580" height="3" fill="url(#brandP4)"/>
</g>
<rect x=".5" y=".5" width="579" height="249" rx="18" fill="none" stroke="url(#strokeP4)" stroke-opacity=".7"/>
<g transform="translate(28 30)">
  <rect width="44" height="44" rx="12" fill="url(#brandP4)" fill-opacity=".9"/>
  <g transform="translate(22 22)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-7 -6 L-12 0 L-7 6 M7 -6 L12 0 L7 6 M3 -9 L-3 9"/>
  </g>
</g>
<text x="86" y="52" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#E6EDF3">Employee Manager</text>
<text x="86" y="73" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B949E">Management System</text>
<g transform="translate(494 34)">
  <rect width="58" height="26" rx="13" fill="#D29922" fill-opacity=".12" stroke="#D29922" stroke-opacity=".55"/>
  
  <text x="29" y="17.5" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#D29922">CRUD</text>
</g>
<text y="114" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#C9D1D9"><tspan x="28" dy="0">Full-stack employee management — add, update,</tspan><tspan x="28" dy="23">delete, search and filter staff records through a</tspan><tspan x="28" dy="23">RESTful API.</tspan></text>
<rect x="28" y="196" width="59" height="28" rx="8" fill="#4FC3F7" fill-opacity=".08" stroke="#4FC3F7" stroke-opacity=".25"/><text x="58" y="215" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4FC3F7">React</text><rect x="95" y="196" width="74" height="28" rx="8" fill="#4FC3F7" fill-opacity=".08" stroke="#4FC3F7" stroke-opacity=".25"/><text x="132" y="215" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4FC3F7">Node.js</text><rect x="177" y="196" width="74" height="28" rx="8" fill="#4FC3F7" fill-opacity=".08" stroke="#4FC3F7" stroke-opacity=".25"/><text x="214" y="215" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4FC3F7">Express</text><rect x="259" y="196" width="59" height="28" rx="8" fill="#4FC3F7" fill-opacity=".08" stroke="#4FC3F7" stroke-opacity=".25"/><text x="288" y="215" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4FC3F7">MySQL</text>
</svg>