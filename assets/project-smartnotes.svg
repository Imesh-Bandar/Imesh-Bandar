<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-label="SmartNotes — Note-taking App">
<title>SmartNotes — Note-taking App</title>
<defs>
  <linearGradient id="bgP3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0D1424"/>
  </linearGradient>
  <linearGradient id="brandP3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4FC3F7"/><stop offset=".55" stop-color="#2F6BFF"/><stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <linearGradient id="strokeP3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity=".9"/><stop offset=".5" stop-color="#2F6BFF" stop-opacity=".25"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".8"/>
  </linearGradient>
  <pattern id="dotsP3" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/>
  </pattern>
  <filter id="blurP3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glowP3" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="cP3"><rect width="580" height="250" rx="18"/></clipPath></defs>
<g clip-path="url(#cP3)">
  <rect width="580" height="250" fill="url(#bgP3)"/>
  <circle cx="540" cy="-10" r="120" fill="#3FB950" opacity="0.22" filter="url(#blurP3)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -30 20; 0 0" dur="10s" repeatCount="indefinite"/>
  </circle>
  <rect width="580" height="250" fill="url(#dotsP3)"/>
  <rect width="580" height="3" fill="url(#brandP3)"/>
</g>
<rect x=".5" y=".5" width="579" height="249" rx="18" fill="none" stroke="url(#strokeP3)" stroke-opacity=".7"/>
<g transform="translate(28 30)">
  <rect width="44" height="44" rx="12" fill="url(#brandP3)" fill-opacity=".9"/>
  <g transform="translate(22 22)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-7 -6 L-12 0 L-7 6 M7 -6 L12 0 L7 6 M3 -9 L-3 9"/>
  </g>
</g>
<text x="86" y="52" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#E6EDF3">SmartNotes</text>
<text x="86" y="73" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8B949E">Note-taking App</text>
<g transform="translate(494 34)">
  <rect width="58" height="26" rx="13" fill="#3FB950" fill-opacity=".12" stroke="#3FB950" stroke-opacity=".55"/>
  
  <text x="29" y="17.5" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#3FB950">MERN</text>
</g>
<text y="114" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#C9D1D9"><tspan x="28" dy="0">Modern note-taking app with full CRUD, a responsive</tspan><tspan x="28" dy="23">grid UI, light / dark mode and Upstash Redis</tspan><tspan x="28" dy="23">rate limiting.</tspan></text>
<rect x="28" y="196" width="59" height="28" rx="8" fill="#4FC3F7" fill-opacity=".08" stroke="#4FC3F7" stroke-opacity=".25"/><text x="58" y="215" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4FC3F7">React</text><rect x="95" y="196" width="52" height="28" rx="8" fill="#4FC3F7" fill-opacity=".08" stroke="#4FC3F7" stroke-opacity=".25"/><text x="121" y="215" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4FC3F7">Vite</text><rect x="155" y="196" width="81" height="28" rx="8" fill="#4FC3F7" fill-opacity=".08" stroke="#4FC3F7" stroke-opacity=".25"/><text x="195" y="215" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4FC3F7">Tailwind</text><rect x="244" y="196" width="74" height="28" rx="8" fill="#4FC3F7" fill-opacity=".08" stroke="#4FC3F7" stroke-opacity=".25"/><text x="281" y="215" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4FC3F7">Node.js</text><rect x="326" y="196" width="74" height="28" rx="8" fill="#4FC3F7" fill-opacity=".08" stroke="#4FC3F7" stroke-opacity=".25"/><text x="362" y="215" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4FC3F7">MongoDB</text>
</svg>