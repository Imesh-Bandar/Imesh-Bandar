<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-label="GitHub Analytics">
<title>GitHub Analytics</title>
<defs>
  <linearGradient id="bgT" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0D1424"/>
  </linearGradient>
  <linearGradient id="brandT" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4FC3F7"/><stop offset=".55" stop-color="#2F6BFF"/><stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <linearGradient id="strokeT" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity=".9"/><stop offset=".5" stop-color="#2F6BFF" stop-opacity=".25"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".8"/>
  </linearGradient>
  <pattern id="dotsT" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/>
  </pattern>
  <filter id="blurT" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glowT" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="fadeT" x1="0" x2="1"><stop offset="0" stop-color="#4FC3F7" stop-opacity=".7"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
</defs>
<text x="0" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#4FC3F7">05</text>
<text x="44" y="42" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="-.5" fill="url(#brandT)">GitHub Analytics</text>
<text x="44" y="72" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8B949E">Contributions, languages and streaks</text>
<rect x="44" y="86" width="1150" height="2" rx="1" fill="url(#fadeT)"></rect>
</svg>